<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>great-pm board</title>
<style>
  :root{
    --bg:#0b0c10; --panel:#121319; --panel2:#171922; --line:#23252f;
    --txt:#e7e9ee; --dim:#8b8f9e; --faint:#5b5f6d;
    --accent:#8b5cf6; --accent2:#a78bfa;
    --backlog:#6b7280; --prog:#f59e0b; --done:#34d399; --gate:#a855f7; --blocked:#ef4444;
    --p0:#ef4444; --p1:#f59e0b; --p2:#8b5cf6; --p3:#6b7280;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  a{color:var(--accent2)}
  #app{display:grid;grid-template-columns:212px 1fr;height:100vh}
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px;gap:14px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
  .brand .dot{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .switch label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:5px}
  .switch select{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13px}
  .nav{display:flex;flex-direction:column;gap:1px;margin-top:2px}
  .nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;color:var(--dim);display:flex;align-items:center;gap:10px;font-size:13px}
  .nav button .lbl{flex:1}
  .nav button svg{width:15px;height:15px;flex:none}
  .nav button.on,.nav button:hover{background:var(--panel2);color:var(--txt)}
  .nav button.on{box-shadow:inset 3px 0 0 var(--ic);font-weight:600}
  .nav .cnt{font-size:10px;color:var(--faint);background:#1d1f29;border:1px solid var(--line);border-radius:10px;padding:0 6px;min-width:18px;text-align:center}
  .spacer{flex:1}
  .live{font-size:11px;color:var(--faint);display:flex;align-items:center;gap:7px}
  .live .pulse{width:7px;height:7px;border-radius:50%;background:var(--done);animation:p 2s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 6px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
  main{display:flex;flex-direction:column;min-width:0;height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:15px 22px;border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
  header .crumbs{color:var(--faint);font-size:12.5px;padding-left:12px;border-left:1px solid var(--line)}
  header .grow{flex:1}
  #search{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:7px 10px;font-size:12px;width:200px}
  #search:focus{outline:1px solid var(--accent);border-color:var(--accent)}
  .btn{all:unset;cursor:pointer;background:var(--accent);color:#fff;padding:7px 12px;border-radius:8px;font-weight:600;font-size:12px}
  .btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .banner{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:8px 12px;margin:10px 18px}
  .content{flex:1;display:flex;min-height:0}
  /* filter bar (board) */
  .filterbar{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:11px 18px;border-bottom:1px solid var(--line)}
  .fgrp{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-left:6px}
  .fgrp:first-child{margin-left:0}
  .fchip{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--panel2);color:var(--dim);border:1px solid var(--line);cursor:pointer;user-select:none}
  .fchip:hover{color:var(--txt);border-color:var(--accent)} .fchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .fclear{font-size:11px;color:var(--faint);cursor:pointer;margin-left:4px} .fclear:hover{color:var(--accent2)}
  /* kanban */
  .kanban{flex:1;display:flex;gap:12px;overflow:auto;padding:16px 20px;align-items:flex-start}
  .kcol{flex:1 1 0;min-width:236px;display:flex;flex-direction:column;max-height:100%}
  .kcol-head{display:flex;align-items:center;gap:8px;padding:6px 8px 12px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;border-radius:6px}
  .kcol-head:hover{color:#fff} .kcol-head .dotc{width:9px;height:9px;border-radius:50%} .kcol-head .cnt{color:var(--faint);font-weight:500}
  .kcol-body{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:3px;border-radius:10px;min-height:60px;border:1px solid transparent;transition:background .12s,border-color .12s}
  .kcol-body.drop{background:#1b1733;border-color:var(--accent)}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;cursor:pointer;border-left:3px solid var(--p2);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:border-color .12s,transform .12s,box-shadow .12s}
  .card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.32)} .card.gate{border-left-color:var(--gate)}
  .card .id{font-size:10px;color:var(--faint);font-family:ui-monospace,Menlo,monospace}
  .card .t{font-size:12.5px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
  .card .meta{display:flex;gap:5px;align-items:center;margin-top:7px;flex-wrap:wrap}
  .chip{font-size:9.5px;padding:1px 6px;border-radius:20px;background:#22242e;color:var(--dim);border:1px solid var(--line)}
  .chip.gate{background:rgba(168,85,247,.14);color:var(--gate);border-color:transparent}
  .pri{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:5px}
  .cardfoot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .ssel{background:#1d1f29;color:var(--dim);border:1px solid var(--line);border-radius:6px;font-size:10.5px;padding:2px 4px;cursor:pointer}
  .ssel:hover{color:var(--txt);border-color:var(--accent)}
  .kempty{color:var(--faint);font-size:11.5px;text-align:center;padding:14px 0}
  /* pages */
  .page{flex:1;overflow:auto;padding:22px 26px}
  .page h2{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
  .page h2:first-child{margin-top:2px}
  .page h2 .badge{font-size:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--dim)}
  .panelbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.22)}
  .metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:124px;border-top:2px solid var(--mc,var(--line));box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .metric .v{font-size:24px;font-weight:700;line-height:1.1;letter-spacing:-.02em}.metric .k{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:4px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .tabrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .metric.tabtile{cursor:pointer;transition:border-color .12s,box-shadow .12s;min-width:104px}
  .metric.tabtile:hover{border-color:var(--mc,var(--accent))}
  .metric.tabtile.on{border-color:var(--mc,var(--accent));box-shadow:0 0 0 1px var(--mc,var(--accent)) inset}
  .tabbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
  .tabpill{font-size:12px;padding:5px 12px;border-radius:8px;background:var(--panel2);color:var(--dim);border:1px solid var(--line);cursor:pointer;user-select:none}
  .tabpill:hover{color:var(--txt);border-color:var(--accent)}
  .tabpill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .klist .tabbar{margin-bottom:12px}.klist .tabpill{font-size:11px;padding:3px 9px}
  .listitem{display:flex;gap:11px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:border-color .12s,transform .12s}
  .listitem:hover{border-color:var(--accent);transform:translateY(-1px)}
  .listitem .lid{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--faint);flex:none;width:54px;padding-top:1px}
  .listitem .lt{font-size:12.5px}.listitem .lsub{color:var(--faint);font-size:10.5px;margin-top:2px}
  /* shared card-list components (Help, concepts, lists) */
  .item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:12.5px;transition:border-color .12s,transform .12s}
  .item:hover{border-color:var(--accent);transform:translateY(-1px)}
  .item b{font-size:13px;color:var(--txt);font-weight:700}
  .item .sub{color:var(--dim);font-size:12px;line-height:1.55;margin-top:5px;word-break:break-word}
  .grp-h{font-size:11px;font-weight:700;color:var(--accent2);letter-spacing:.09em;text-transform:uppercase;margin:26px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  .agrid{column-width:380px;column-gap:14px;margin-bottom:4px}
  .acard{break-inside:avoid;-webkit-column-break-inside:avoid;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin:0 0 13px;transition:border-color .12s,transform .12s,box-shadow .12s}
  .acard:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.32)}
  .acard .an{font-weight:700;font-size:13px;color:var(--txt);font-family:ui-monospace,Menlo,monospace}
  .acard .ad{color:var(--dim);font-size:12px;line-height:1.55;margin-top:7px}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .tbl th{text-align:left;color:var(--faint);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-bottom:1px solid var(--line)}
  .tbl td{padding:8px 10px;border-bottom:1px solid var(--line)} .tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--panel2)}
  .bar{height:8px;border-radius:5px;background:#1d1f29;overflow:hidden;min-width:120px}.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .barwrap{display:flex;align-items:center;gap:10px;padding:3px 0}.barwrap .lbl{width:100px;color:var(--dim)}.barwrap .n{width:80px;text-align:right;color:var(--faint);font-size:11px}
  .filters{display:flex;gap:8px;margin-bottom:12px}.filters select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:130px}
  .verdict .done{color:var(--done)}.verdict .blocked{color:var(--p0)}
  /* loop stepper */
  .loop{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;padding:6px 0}
  .lstage{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:4px;text-align:center;position:relative}
  .lstage.done{border-color:var(--done)} .lstage.active{border-color:var(--prog);box-shadow:0 0 0 1px var(--prog) inset}
  .lstage .sn{font-size:13px;font-weight:650} .lstage .ss{font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
  .lstage.done .ss{color:var(--done)} .lstage.active .ss{color:var(--prog)} .lstage.pending .ss{color:var(--faint)}
  .lstage .sc{font-size:10px;color:var(--faint);margin-top:6px}
  .lgate{align-self:center;font-size:10px;padding:3px 7px;border-radius:8px;border:1px dashed var(--line);color:var(--faint);margin:0 2px;white-space:nowrap}
  .lgate.approved{border-color:var(--done);color:var(--done);border-style:solid} .lgate.pending{border-color:var(--gate);color:var(--gate)}
  /* knowledge browser */
  .kbrowse{flex:1;display:flex;min-height:0}
  .klist{width:320px;border-right:1px solid var(--line);overflow:auto;padding:14px}
  .kcat{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px}.kcat:first-child{margin-top:0}
  .kfile{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;background:var(--panel2)}
  .kfile:hover{border-color:var(--accent)} .kfile.sel{border-color:var(--accent);background:#1b1733}
  .kfile.missing{opacity:.5;cursor:default}.kfile.missing:hover{border-color:var(--line)}
  .kdot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex:none;background:var(--done)} .kfile.missing .kdot{background:var(--faint)}
  .kfn{font-size:12px;font-family:ui-monospace,Menlo,monospace} .kfd{color:var(--faint);font-size:10.5px;margin-top:2px}
  .kreader{flex:1;overflow:auto;padding:22px 26px}
  .kreader .mdh{color:var(--txt);margin:18px 0 8px;line-height:1.3} .kreader .mdh:first-child{margin-top:0}
  .kreader p{margin:8px 0;color:#cdd0d8} .kreader .mdul{margin:8px 0;padding-left:20px;color:#cdd0d8} .kreader li{margin:4px 0}
  .kreader code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11.5px}
  .kreader .mdhr{border:none;border-top:1px solid var(--line);margin:16px 0}
  .mdtbl{border-collapse:collapse;width:100%;margin:12px 0;font-size:12px}
  .mdtbl th,.mdtbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
  .mdtbl th{background:var(--panel2);color:var(--dim);font-weight:600}
  .mdtbl tr:nth-child(even) td{background:rgba(255,255,255,.012)}
  pre.full{white-space:pre-wrap;font:12px/1.55 ui-monospace,Menlo,monospace;color:#cdd0d8;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px;margin:10px 0;overflow:auto}
  .khint{color:var(--faint);font-size:12.5px;margin-top:40px;text-align:center}
  /* modal + drawer + toast */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}.modal-bg.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:420px;max-width:92vw}
  .modal h2{margin:0 0 12px;font-size:15px}.modal label{display:block;font-size:11px;color:var(--dim);margin:10px 0 4px}
  .modal input,.modal select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px;font-size:13px}
  .modal .mrow{display:flex;gap:10px}.modal .mrow>div{flex:1}.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:55}.drawer-bg.show{display:block}
  .drawer{position:absolute;top:0;right:0;height:100%;width:440px;max-width:94vw;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .18s ease}
  .drawer-bg.show .drawer{transform:translateX(0)}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
  .drawer-head .ttl{font-weight:650;font-size:14px}.drawer-head button{all:unset;cursor:pointer;color:var(--dim);font-size:16px;padding:2px 8px;border-radius:6px}.drawer-head button:hover{background:var(--panel2);color:var(--txt)}
  .drawer-body{overflow:auto;padding:14px 16px}
  .explain{font-size:12.5px;line-height:1.55;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:11px 13px;margin-bottom:16px}
  .drow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.drow .k{width:96px;flex:none;color:var(--faint);font-size:11px;text-transform:uppercase}.drow .val{flex:1;font-size:13px;word-break:break-word}
  .desc{white-space:pre-wrap;font-size:12.5px;line-height:1.55;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px;margin-top:10px}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1a1c25;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:60vw}
  #toast.show{opacity:1}#toast.err{border-color:var(--p0);color:#fca5a5}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><div class="dot"></div>great-pm</div>
    <div class="switch"><label>Project</label><select id="project"></select></div>
    <div class="nav" id="nav"></div>
    <div class="spacer"></div>
    <div class="live"><span class="pulse"></span><span id="livetxt">live</span></div>
  </aside>
  <main>
    <header>
      <h1 id="vtitle">Inbox</h1><span class="crumbs" id="crumb"></span>
      <div class="grow"></div>
      <input id="search" placeholder="Search id / title…" style="display:none" />
      <button class="btn ghost" id="refresh">Refresh</button>
      <button class="btn" id="new">+ New issue</button>
    </header>
    <div id="filterbar" class="filterbar" style="display:none"></div>
    <div id="banner"></div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="modal-bg" id="modalbg"><div class="modal">
  <h2>New issue</h2>
  <label>Title</label><input id="m-title" placeholder="What needs doing?" />
  <div class="mrow">
    <div><label>Type</label><select id="m-type"><option>task</option><option>bug</option><option>feature</option></select></div>
    <div><label>Priority</label><select id="m-prio"><option value="0">P0</option><option value="1">P1</option><option value="2" selected>P2</option><option value="3">P3</option><option value="4">P4</option></select></div>
  </div>
  <label>Stage</label>
  <select id="m-stage"><option value="">Unstaged / Ops</option><option>discover</option><option>strategize</option><option>prioritize</option><option>define</option><option>launch</option><option>measure</option></select>
  <div class="actions"><button class="btn ghost" id="m-cancel">Cancel</button><button class="btn" id="m-create">Create</button></div>
</div></div>

<div class="modal-bg" id="cardmodal"><div class="modal" style="width:580px;max-width:94vw;max-height:86vh;overflow:auto">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><span id="cm-title" style="font-weight:650;font-size:14px"></span><button id="cm-x" title="Close" style="all:unset;cursor:pointer;color:var(--dim);font-size:16px;padding:2px 8px;border-radius:6px">✕</button></div>
  <div id="cm-body"></div>
</div></div>
<div id="toast"></div>

<script>
const STAGES=['discover','strategize','prioritize','define','launch','measure'];
const PRI=['P0','P1','P2','P3','P4'];
const BCOLS=[['gates','Gates','var(--gate)'],['backlog','Backlog','var(--backlog)'],['inprogress','In Progress','var(--prog)'],['done','Done','var(--done)'],['blocked','Blocked','var(--blocked)']];
const STATUS_OF_BCOL={backlog:'open',inprogress:'in_progress',done:'closed',blocked:'blocked'};
const SLABEL={open:'Backlog',in_progress:'In Progress',closed:'Done',blocked:'Blocked'};
const ICONS={
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  board:'<rect x="3" y="4" width="4" height="16" rx="1"/><rect x="10" y="4" width="4" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/>',
  roadmap:'<path d="M4 22V4"/><path d="M4 4h12l-2 3.5L16 11H4"/>',
  loop:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/>',
  knowledge:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  metrics:'<path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="7" rx="1"/><rect x="12" y="7" width="3" height="11" rx="1"/><rect x="17" y="4" width="3" height="14" rx="1"/>',
  logs:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',

function toast(m,err){const t=$('#toast');t.textContent=m;t.className='show'+(err?' err':'');setTimeout(()=>t.className='',err?3400:1600);}
function fmt(ts){return ts?ts.replace('T',' ').replace('Z',' UTC'):'—';}
function ageDays(ts){try{return (Date.parse(new Date().toISOString())-Date.parse(ts))/864e5;}catch{return 0;}}
function bcol(i){ if(i.status==='closed')return 'done'; if(i.status==='blocked')return 'blocked'; if(i.isGate)return 'gates'; if(i.status==='in_progress')return 'inprogress'; return 'backlog'; }

function inl(s){return s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+?)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank">$1</a>');}
function md(src){
  if(!src) return '<div class="kempty">empty</div>';
  const lines=esc(src).split('\n'); let h='',inUl=false,inPre=false,pre='';
  const cu=()=>{if(inUl){h+='</ul>';inUl=false;}};
  const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  for(let idx=0; idx<lines.length; idx++){
    let ln=lines[idx];
    if(/^```/.test(ln)){ if(inPre){h+=`<pre class="full">${pre}</pre>`;pre='';inPre=false;} else {cu();inPre=true;} continue; }
    if(inPre){pre+=ln+'\n';continue;}
    if(/^\s*\|(.+)\|\s*$/.test(ln) && idx+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[idx+1])){
      cu(); const head=cells(ln); idx+=2; const body=[];
      while(idx<lines.length && /^\s*\|(.+)\|\s*$/.test(lines[idx])){ body.push(cells(lines[idx])); idx++; } idx--;
      h+='<table class="mdtbl"><thead><tr>'+head.map(c=>`<th>${inl(c)}</th>`).join('')+'</tr></thead><tbody>'+body.map(r=>'<tr>'+r.map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table>'; continue;
    }
    if(/^#{1,6}\s/.test(ln)){cu();const lvl=Math.min(ln.match(/^#+/)[0].length+1,6);h+=`<h${lvl} class="mdh">${inl(ln.replace(/^#+\s/,''))}</h${lvl}>`;}
    else if(/^\s*[-*+]\s/.test(ln)){if(!inUl){h+='<ul class="mdul">';inUl=true;}h+=`<li>${inl(ln.replace(/^\s*[-*+]\s/,''))}</li>`;}
    else if(/^\s*\d+\.\s/.test(ln)){if(!inUl){h+='<ul class="mdul">';inUl=true;}h+=`<li>${inl(ln.replace(/^\s*\d+\.\s/,''))}</li>`;}
    else if(/^---+\s*$/.test(ln)){cu();h+='<hr class="mdhr">';}
    else if(ln.trim()===''){cu();}
    else {cu();h+=`<p>${inl(ln)}</p>`;}
  }
  if(inPre)h+=`<pre class="full">${pre}</pre>`; cu(); return h;
}

function stageStatus(s){const items=(board.issues||[]).filter(i=>(i.labels||[]).includes('stage-'+s));
  if(!items.length){return (DOCS?.docs||[]).some(d=>d.exists&&d.category.toLowerCase().startsWith(s.slice(0,5)))?'done':'pending';}
  return items.every(i=>i.status==='closed')?'done':'active';}

function renderLoop(){
  const p=$('#page'); const GATES={prioritize:'strategy',define:'spec',launch:'launch'};

// ── BOARD (status kanban + filters) ───────────────────────────────────────────
function passFilters(i){const s=search.trim().toLowerCase();
  if(s && !((i.id+' '+i.title).toLowerCase().includes(s))) return false;
  const labs=i.labels||[];
  if(filters.agent.size && !labs.some(l=>filters.agent.has(l))) return false;
  if(filters.stage.size && !labs.some(l=>filters.stage.has(l))) return false;
  if(filters.priority.size && !filters.priority.has(String(i.priority))) return false;
  return true;}
function renderFilterBar(){
  const iss=board.issues||[];
  const agents=[...new Set(iss.flatMap(i=>(i.labels||[]).filter(l=>l.startsWith('agent-'))))].sort();
  const stages=[...new Set(iss.flatMap(i=>(i.labels||[]).filter(l=>l.startsWith('stage-'))))].sort();
  const prios=[...new Set(iss.map(i=>i.priority).filter(p=>p!=null))].sort((a,b)=>a-b);
  const chip=(g,v,l)=>`<span class="fchip ${filters[g].has(v)?'on':''}" data-grp="${g}" data-val="${v}">${esc(l)}</span>`;
  let h='';
  h+='<span class="fgrp">View</span>'+[['all','Show all']].concat(BCOLS.map(b=>[b[0],b[1]])).map(([id,l])=>`<span class="fchip ${boardCol===id?'on':''}" data-col="${id}">${esc(l)}</span>`).join('');

  if(prios.length)h+='<span class="fgrp">Priority</span>'+prios.map(p=>chip('priority',String(p),PRI[p]||('P'+p))).join('');
  if(stages.length)h+='<span class="fgrp">Stage</span>'+stages.map(s=>chip('stage',s,s.replace('stage-',''))).join('');
  const act=filters.agent.size+filters.priority.size+filters.stage.size;
  if(act)h+=`<span class="fclear" id="fclear">clear ${act} filter${act>1?'s':''}</span>`;
  $('#filterbar').innerHTML=h||'<span class="fgrp">No labels to filter</span>';
  $('#filterbar').querySelectorAll('.fchip[data-grp]').forEach(el=>el.onclick=()=>{const g=el.dataset.grp,v=el.dataset.val;filters[g].has(v)?filters[g].delete(v):filters[g].add(v);renderFilterBar();renderKanban();});
  $('#filterbar').querySelectorAll('.fchip[data-col]').forEach(el=>el.onclick=()=>{boardCol=el.dataset.col;renderFilterBar();renderKanban();});

function card(i){const pc=`var(--p${Math.min(i.priority??3,3)})`;
  const opts=[['open','Backlog'],['in_progress','In Progress'],['closed','Done'],['blocked','Blocked']].map(([v,l])=>`<option value="${v}" ${i.status===v?'selected':''}>${l}</option>`).join('');

    <div class="cardfoot"><select class="ssel" data-id="${i.id}">${opts}</select></div></div>`;}
function renderKanban(){
  const k=$('#kanban'); if(!k)return; const iss=(board.issues||[]).filter(passFilters);
  const cols=boardCol==='all'?BCOLS:BCOLS.filter(b=>b[0]===boardCol);
  k.innerHTML=cols.map(([col,label,color])=>{const items=iss.filter(i=>bcol(i)===col).sort((a,b)=>(a.priority??9)-(b.priority??9));
    return `<div class="kcol"><div class="kcol-head" data-col="${col}"><span class="dotc" style="background:${color}"></span>${label} <span class="cnt">${items.length}</span></div><div class="kcol-body" data-col="${col}">${items.length?items.map(card).join(''):'<div class="kempty">No tasks</div>'}</div></div>`;}).join('');
  k.querySelectorAll('.kcol-head').forEach(h=>h.onclick=()=>{boardCol=h.dataset.col;renderFilterBar();renderKanban();});
  k.querySelectorAll('.ssel').forEach(s=>{s.onclick=e=>e.stopPropagation();s.onchange=async e=>{e.stopPropagation();paused=true;const r=await mutate({action:'set-status',id:s.dataset.id,column:Object.keys(STATUS_OF_BCOL).find(c=>STATUS_OF_BCOL[c]===e.target.value)});paused=false;if(r.ok){toast(`${s.dataset.id} → ${SLABEL[e.target.value]}`);refresh();}else toast(r.error,true);};});
  wireDnD();

function wireDnD(){
  document.querySelectorAll('.card').forEach(c=>{let moved=false;
    c.addEventListener('dragstart',e=>{moved=true;dragging={id:c.dataset.id,col:c.dataset.col,gate:c.dataset.gate==='1'};paused=true;e.dataTransfer.effectAllowed='move';});
    c.addEventListener('dragend',()=>{paused=false;document.querySelectorAll('.kcol-body.drop').forEach(x=>x.classList.remove('drop'));setTimeout(()=>moved=false,30);});
    c.addEventListener('click',()=>{if(!moved)openCard(c.dataset.id);});});
  document.querySelectorAll('.kcol-body').forEach(cell=>{
    cell.addEventListener('dragover',e=>{e.preventDefault();cell.classList.add('drop');});
    cell.addEventListener('dragleave',()=>cell.classList.remove('drop'));
    cell.addEventListener('drop',async e=>{e.preventDefault();cell.classList.remove('drop');if(!dragging)return;
      const tc=cell.dataset.col,d=dragging;dragging=null; if(tc===d.col){paused=false;return;}
      try{ if(tc==='gates'){if(!d.gate){const r=await mutate({action:'set-gate',id:d.id,gate:true});if(!r.ok)throw r.error;}toast(`${d.id} → Gates`);}
        else{const r=await mutate({action:'set-status',id:d.id,column:tc});if(!r.ok)throw r.error;toast(`${d.id} → ${BCOLS.find(c=>c[0]===tc)[1]}`);}
      }catch(err){toast('Could not move '+d.id+': '+err,true);}
      paused=false; await refresh();});});
}

async function renderMetricsView(){

function agentGroup(n){
  if(/-pm-reviewer$/.test(n)) return 'Archetype reviewers · per product type';
  if(/^ai-/.test(n)||['mlops-pm','model-evaluator-pm','prompt-engineer-pm','query-refiner-pm','data-strategist'].includes(n)) return 'AI-PM pack';
  if(['pm-reviewer','pm-advisor','devils-advocate'].includes(n)) return 'Critical trio · stress-tests every big call';
  if(n==='pm-lead') return 'Orchestrator';
  if(['user-researcher','feedback-synthesizer','market-analyst','product-strategist','pricing-strategist','strategy-analyst','prioritization-analyst','roadmap-planner','tradeoff-arbiter','spec-writer','spec-reviewer','metrics-architect','launch-manager','gtm-strategist','analytics-analyst','experiment-designer'].includes(n)) return 'The 6-stage loop team';
  return 'Cross-cutting & meta';
}

  p.innerHTML=`<div class="explain">great-pm gives a solo PM or founder a full product team — <b>${g.agents.length} agents</b> + <b>${g.skills} skills</b> + <b>${g.commands.length} commands</b>, run through a 6-stage loop with 3 human gates. This page is generated live from what's installed.</div>${tabbar}`

$('#refresh').onclick=()=>{LOGS=null;DOCS=null;refresh().then(()=>setView(view));};
(async function init(){renderNav();if(await loadProjects()){await refresh();const h=location.hash.slice(1);await setView(VIEWS.some(x=>x[0]===h)?h:'inbox');}setInterval(()=>{if(!paused&&(view==='inbox'||view==='board'||view==='metrics'))refresh();},5000);})();
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.some(x=>x[0]===h)&&h!==view)setView(h);});
</script>
